name: Deploy CCIEA Dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # update every day at 12 pm UTC = 5 am PDT
    - cron: '0 12 * * *'

permissions:
  contents: write # Allows the token to push

concurrency:
  group: deploy-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      QUARTO_VERSION: '1.3.441'
      R_LIBS_USER: ${{ github.workspace }}/R/library

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}
          tinytex: false

      - name: Verify Quarto
        run: quarto --version

      - name: Configure R Library Directory
        run: |
          mkdir -p "${R_LIBS_USER}"
          echo "R_LIBS_USER=${R_LIBS_USER}" >> ~/.Renviron

      - name: Restore R package cache
        id: cache-r
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/renv.lock', '**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-

      - name: Install R deps
        run: |
          Rscript -e 'if (!requireNamespace("remotes", quietly=TRUE)) install.packages("remotes", repos="https://cloud.r-project.org")'
          Rscript -e 'remotes::install_deps(dependencies = TRUE, repos="https://cloud.r-project.org")'

      - name: Import data
        run: Rscript update_dashboard.R

      - name: Commit results (if any)
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Dashboard updated'
            git push origin "HEAD:${{ github.ref_name }}" 
          else
            echo "No changes to commit"
          fi

      - name: Publish to GitHub Pages (and render)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          